<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Variant to'lov</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff); --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8f); --card: var(--tg-theme-secondary-bg-color, #f2f2f6);
    --btn: var(--tg-theme-button-color, #2481cc); --btntext: var(--tg-theme-button-text-color, #fff);
    --green: #059669; --red: #f0455a; --amber: #f59e0b;
    --g-main: linear-gradient(135deg, #065f46 0%, #10b981 100%);
    --g-green: linear-gradient(90deg, #059669, #34d399);
    --g-warm: linear-gradient(135deg, #b4892f, #e9c47e);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 16px 16px 90px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif; font-size: 15px; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .muted { color: var(--hint); font-size: 13px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  /* Panel sarlavhasi: nom bir qatorda, tugmalar sig'masa pastga tushadi */
  .top.head { flex-wrap: wrap; gap: 8px 10px; }
  .top.head h2 { white-space: nowrap; }
  .icons { display: flex; gap: 6px; }
  .icons button { border: 0; background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 13px;
    font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  /* Bir xil chiziqli ikonlar (emoji o'rniga): har telefonda bir xil ko'rinadi */
  .ic { width: 18px; height: 18px; flex: none; vertical-align: -4px; }
  .icons .ic { width: 16px; height: 16px; color: var(--green); }
  /* Qidiruv */
  .search { position: relative; margin-top: 14px; }
  .search > .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--hint); pointer-events: none; }
  .search input { padding: 11px 42px 11px 40px; border-radius: 12px; -webkit-appearance: none; appearance: none; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clr { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0;
    background: none; color: var(--hint); display: none; align-items: center; justify-content: center; }
  .search.has .clr { display: flex; }
  .found { font-size: 13px; color: var(--hint); margin: 0 2px 8px; }
  /* Yuklanish skeleti */
  .sk { border-radius: 14px; background: linear-gradient(90deg, var(--card) 30%, rgba(128,128,128,.16) 50%, var(--card) 70%);
    background-size: 220% 100%; animation: sk 1.3s linear infinite; }
  @keyframes sk { from { background-position: 110% 0; } to { background-position: -110% 0; } }
  /* Bo'sh holat */
  .empty-st { text-align: center; padding: 30px 18px; background: var(--card); border-radius: 18px; margin-top: 14px; }
  .empty-st > .ic { width: 42px; height: 42px; color: var(--green); }
  .empty-st h3 { margin: 10px 0 6px; font-size: 17px; }
  .empty-st .btn { width: auto; display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } .ab, .card { transition: none; } }
  .summary { background: var(--g-main); color: #fff; border-radius: 20px; padding: 18px; margin-bottom: 12px;
    box-shadow: 0 8px 22px rgba(4,120,87,.35); position: relative; overflow: hidden; }
  .summary::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,.14); }
  .summary .muted { color: rgba(255,255,255,.8); }
  .summary .big { font-size: 32px; font-weight: 800; margin: 2px 0 12px; letter-spacing: -.5px; }
  .summary .grid > div { background: rgba(255,255,255,.18); border-radius: 12px; padding: 8px 10px; }
  .summary .grid b { color: #fff !important; }
  .summary .bar { background: rgba(255,255,255,.28); }
  .summary .bar i { background: #fff; }
  /* Aborot kartasi: Umumiy -> C -> T, bosilganda aylanadi */
  .abwrap { perspective: 1200px; margin-bottom: 12px; }
  .ab { --gold: #e9c47e; background: linear-gradient(160deg, #0f5240 0%, #06281f 100%); color: #fff; border-radius: 22px;
    padding: 18px 18px 16px; box-shadow: 0 10px 26px rgba(4,40,30,.42); cursor: pointer; user-select: none;
    transform-style: preserve-3d; transition: transform .22s ease-in; }
  .ab .hd { display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: .4px; }
  .ab .hd b { color: var(--gold); font-weight: 700; text-transform: uppercase; }
  .ab .nx { color: rgba(255,255,255,.72); display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
  .ab .dots { display: flex; gap: 5px; } .ab .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.28); }
  .ab .dots i.on { background: var(--gold); }
  .ab .lbl { color: rgba(255,255,255,.82); font-size: 14px; margin-top: 8px; }
  .ab .big { font-size: 34px; font-weight: 800; letter-spacing: -.5px; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
  .ab .two { gap: 10px; }
  .ab .box { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; padding: 11px 13px; }
  .ab .box span { color: rgba(255,255,255,.78); font-size: 13px; }
  .ab .box b { display: block; font-size: 18px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .ab .pl { display: flex; justify-content: space-between; color: rgba(255,255,255,.82); font-size: 13px; margin-top: 14px; }
  .ab .pl b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .ab .pbar { height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; margin: 7px 0 10px; }
  .ab .late { color: rgba(255,255,255,.66); font-size: 12.5px; margin-bottom: 14px; }
  .ab .pbar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .ab .ft { border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ab .ft span { color: rgba(255,255,255,.85); font-size: 14px; } .ab .ft small { display: block; color: rgba(255,255,255,.6); font-size: 12px; }
  .ab .ft b { color: var(--gold); font-size: 22px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid b { display: block; font-size: 16px; }
  .bar { height: 8px; background: rgba(128,128,128,.22); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--g-green); border-radius: 4px; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 10px; }
  .tabs button { flex: 1; padding: 10px 4px; border: 0; border-radius: 12px; background: var(--card); color: var(--text); font-size: 14px; font-weight: 500; }
  .tabs button.on { background: var(--g-main); color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(4,120,87,.35); }
  .tabs .cnt { display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 5px; border-radius: 10px; font-size: 12px;
    font-weight: 700; background: rgba(128,128,128,.2); font-variant-numeric: tabular-nums; }
  .tabs button.on .cnt { background: rgba(255,255,255,.25); }
  .tabs .cnt.red { background: var(--red); color: #fff; }
  .card { background: var(--card); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
    border-left: 5px solid var(--green); display: flex; gap: 12px; align-items: flex-start; transition: transform .1s; }
  .card:active { transform: scale(.98); }
  .card.late { border-left-color: var(--red); }
  .card.done { border-left-color: #8a8a8f; opacity: .85; }
  .card .body { flex: 1; min-width: 0; }
  /* Kartochka: asosiysi — qolgan qarz va keyingi to'lov; qolgani xira */
  .card .sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--hint); margin-top: 3px; }
  .card .prod { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .card .prod span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub .ic, .card .meta .ic { width: 15px; height: 15px; vertical-align: 0; }
  .card .bar { height: 6px; }
  .card .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: 9px; }
  .card .meta { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--hint); min-width: 0; }
  .card .rem { text-align: right; flex: none; line-height: 1.15; }
  .card .rem b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .card .rem small { font-size: 11px; color: var(--hint); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 16px; display: flex;
    align-items: center; justify-content: center; flex: none; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .card .name { font-weight: 700; font-size: 16px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--hint); margin-top: 6px; gap: 8px; }
  .row b { color: var(--text); }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
  .b-red { background: rgba(240,69,90,.16); color: var(--red); }
  .b-green { background: rgba(5,150,105,.16); color: var(--green); }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }
  /* Ixcham dumaloq tugma: mijoz kartalarining matnini to'smaydi */
  .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 56px; height: 56px; padding: 0;
    border: 0; border-radius: 50%; background: var(--g-warm); color: #10261d; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(180,137,47,.45); z-index: 5; }
  .fab[hidden] { display: none; }
  .fab .ic { width: 26px; height: 26px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 10; }
  .overlay.show { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px 28px; }
  .sheet .head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .x { border: 0; background: var(--card); color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; flex: none; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid transparent; background: var(--card);
    color: var(--text); font-size: 16px; font-family: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--hint); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .two > *, input, select { min-width: 0; }
  input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 46px; padding: 12px 8px; }
  .btn { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: var(--g-main); color: #fff; font-size: 16px; font-weight: 700; margin-top: 12px;
    box-shadow: 0 6px 16px rgba(4,120,87,.35); }
  .btn.sec { background: var(--card); color: var(--text); font-weight: 500; margin-top: 8px; box-shadow: none; }
  .btn.danger { color: var(--red); }
  details.more { margin-top: 12px; }
  details.more summary { color: var(--btn); font-size: 14px; cursor: pointer; padding: 6px 0; }
  .info { margin-top: 10px; background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
  .info:empty { display: none; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 12px; border-radius: 20px; background: var(--card); border: 0; color: var(--text); font-size: 13px; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .stat div { background: var(--card); border-radius: 14px; padding: 10px 12px; border-top: 3px solid rgba(5,150,105,.5); }
  .stat div:nth-child(2) { border-top-color: var(--red); } .stat div:nth-child(3) { border-top-color: var(--green); }
  .stat div:nth-child(4) { border-top-color: var(--amber); } .stat div:nth-child(5) { border-top-color: #14b8a6; }
  .stat div:nth-child(6) { border-top-color: #c9a24f; }
  .stat b { display: block; font-size: 16px; margin-top: 2px; }
  .line { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--card); gap: 8px; }
  .line button { border: 0; background: none; color: var(--hint); font-size: 16px; padding: 4px 8px; }
  .st { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st.paid { color: var(--green); } .st.late { color: var(--red); } .st.partial { color: var(--amber); } .st.pending { color: var(--hint); }
  .note { background: var(--card); border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 14px; white-space: pre-wrap; }
  h4 { margin: 18px 0 4px; }
  a.tel { color: var(--btn); text-decoration: none; }
  button { cursor: pointer; touch-action: manipulation; }
  button.busy { opacity: .6; pointer-events: none; }
  .presets { display: none; margin: 8px 0 4px; }
  .presets.show { display: block; }
  .preset { display: block; width: 100%; text-align: left; border: 0; background: var(--card); color: var(--text); border-radius: 12px;
    padding: 9px 12px; margin-bottom: 6px; font-size: 13px; line-height: 1.35; }
  .preset b { display: block; font-size: 13px; margin-bottom: 2px; }
  .vars { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .vars button { border: 0; border-radius: 8px; padding: 5px 8px; background: var(--card); color: var(--btn); font-size: 12px; }
  .pcard { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pcard .num { font-size: 17px; font-weight: 700; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .pcard button { border: 0; background: var(--g-main); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; flex: none; }
  .pcard button.del { background: none; color: var(--red); font-size: 18px; padding: 4px 8px; }
</style>
</head>
<body>
<div id="app" aria-busy="true" aria-label="Yuklanmoqda">
  <div class="sk" style="height:26px;width:55%"></div>
  <div class="sk" style="height:13px;width:22%;margin-top:9px"></div>
  <div class="sk" style="height:250px;margin-top:18px;border-radius:22px"></div>
  <div class="sk" style="height:44px;margin-top:14px"></div>
  <div class="sk" style="height:42px;margin-top:10px"></div>
  <div class="sk" style="height:100px;margin-top:10px;border-radius:16px"></div>
  <div class="sk" style="height:100px;margin-top:10px;border-radius:16px"></div>
</div>
<div class="muted" style="text-align:center;margin-top:28px"><a class="tel" href="/privacy.html">Maxfiylik</a> · <a class="tel" href="/terms.html">Shartlar</a></div>
<button class="fab" id="fab" hidden aria-label="Mijoz qo'shish" title="Mijoz qo'shish"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, cur = "USD") => { const s = Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  return cur === "USD" ? `$${s}` : cur === "EUR" ? `€${s}` : cur === "TRY" ? `₺${s}` : `${s} so'm`; };
const fdate = (s) => s ? s.split("-").reverse().join(".") : "";
const fiso = (iso) => new Date(iso).toLocaleDateString("ru-RU", { timeZone: "Europe/Istanbul" });
const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Istanbul" }).format(new Date());
// Telegram oynalari eski versiyalarda ishlamasligi yoki boshqa oyna ochiq bo'lsa xato berishi mumkin: shunda oddiy brauzer oynasi
const alertMsg = (m) => { try { tg.showAlert(m); } catch { alert(m); } };
const confirmMsg = (m) => new Promise((r) => { try { tg.showConfirm(m, (ok) => r(!!ok)); } catch { r(confirm(m)); } });
const haptic = (t) => { try { tg.HapticFeedback?.notificationOccurred(t); } catch {} };
const ST = { paid: "✅ To'landi", late: "⚠️ Kechikdi", partial: "🟡 Qisman", pending: "🕒 Kutilmoqda" };

let data = { role: "", debtors: [] }, tab = "all", openId = null, q = "";

// Chiziqli ikonlar (Lucide uslubida, ISC litsenziya): emoji o'rniga, har telefonda bir xil
const ICONS = {
  sheet: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h2M14 13h2M8 17h2M14 17h2"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 8h10M7 12h6"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  wallet: '<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

async function api(path, method = "GET", body) {
  if (data.demo && path !== "/debtors") {
    const e = new Error("Bu namuna rejim: o'zgarishlar saqlanmaydi. To'liq ishlatish uchun egasi sizga ruxsat berishi kerak.");
    e.demo = true; throw e;
  }
  const r = await fetch("/api" + path, { method, headers: { "Content-Type": "application/json", "x-init-data": tg.initData },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error("Sessiya eskirdi. Panelni yopib, qaytadan oching."); e.status = 401; throw e; }
  if (!r.ok) { const e = new Error(j.error || "Xatolik"); e.status = r.status; throw e; }
  return j;
}

async function load() {
  try { data = await api("/debtors"); render(); if (openId) showDetail(openId); }
  catch (e) {
    $("fab").hidden = true;
    $("app").removeAttribute("aria-busy");
    $("app").innerHTML = `<div class="empty"><h2>${e.status === 403 ? "⛔ Ruxsat yo'q" : "Kirib bo'lmadi"}</h2>${esc(e.message)}</div>`;
  }
}

const isOwner = () => data.role === "owner";

// ---------- ro'yxat ----------
function render() {
  $("fab").hidden = !isOwner();
  $("app").removeAttribute("aria-busy");
  if (!isOwner()) return renderCustomer();

  const demo = data.demo ? `<div class="summary" style="border:1px dashed var(--green)"><b>👀 Namuna rejim</b><div class="muted">Bu yerdagi mijozlar soxta. Panel qanday ishlashini ko'rishingiz mumkin, lekin o'zgarishlar saqlanmaydi.</div></div>` : "";
  const head = `<div class="top head"><div><h2>Qarz nazorati</h2><div class="muted">${data.debtors.length} ta mijoz</div></div>
      <div class="icons"><button data-act="excel">${ic("sheet")}Excel</button><button data-act="tpl">${ic("msg")}Matn</button><button data-act="cards">${ic("card")}Karta</button></div></div>`;

  // Hali mijoz yo'q: birinchi qadamni ko'rsatamiz
  if (!data.debtors.length) {
    $("app").innerHTML = `${demo}${head}<div class="empty-st">${ic("users")}<h3>Hali mijoz yo'q</h3>
      <div class="muted">Birinchi mijozni qo'shing — to'lov jadvali va eslatmalar avtomatik tuziladi.</div>
      <button class="btn" data-act="addfirst">${ic("plus")}Birinchi mijozni qo'shish</button></div>`;
    return;
  }

  $("app").innerHTML = `${demo}${head}
    <div style="margin-top:12px"><div class="abwrap"><div class="ab" id="ab" data-act="flip">${abInner()}</div></div></div>
    <div class="search${q ? " has" : ""}">${ic("search")}<input id="q" type="search" enterkeyhint="search" autocomplete="off"

const norm = (s) => String(s ?? "").toLowerCase().replace(/[‘’ʻʼ`´]/g, "'");
const matches = (d, qq) => {
  if (norm([d.name, d.product, d.code, d.note].join(" ")).includes(qq)) return true;
  const dig = qq.replace(/\D/g, "");
  return dig.length >= 3 && String(d.phone ?? "").replace(/\D/g, "").includes(dig);
};

// Sekmalar (soni bilan) va ro'yxat. Qidiruvda hamma mijozlar orasidan izlanadi.
function renderList() {
  const cnt = { all: 0, late: 0, done: 0 };
  for (const d of data.debtors) { if (d.c.done) cnt.done++; else cnt.all++; if (d.c.overdue > 0) cnt.late++; }
  const qq = norm(q.trim());
  $("tabs").innerHTML = [["all", "Faol"], ["late", "Kechikkan"], ["done", "Tugagan"]].map(([k, v]) =>
    `<button data-tab="${k}" class="${!qq && tab === k ? "on" : ""}">${v}<span class="cnt${k === "late" && cnt.late ? " red" : ""}">${cnt[k]}</span></button>`).join("");
  const list = data.debtors.filter((d) => qq ? matches(d, qq) : tab === "all" ? !d.c.done : tab === "late" ? d.c.overdue > 0 : d.c.done)
    .sort((a, b) => b.c.overdue - a.c.overdue || b.c.remaining - a.c.remaining);
  const emptyTxt = qq ? `“${esc(q.trim())}” bo'yicha hech kim topilmadi` : tab === "late" ? "Kechikkan mijoz yo'q 🎉" : "Bu ro'yxatda hech kim yo'q";
  $("list").innerHTML = (qq && list.length ? `<div class="found">${list.length} ta natija</div>` : "") +
    (list.map(card).join("") || `<div class="empty">${emptyTxt}</div>`);
}

// ---------- aborot kartasi ----------
const AB = [["", "Umumiy"], ["C", "C-aborot"], ["T", "T-aborot"]];
const OYLAR = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
let abView = 0;

// Shu oy: yig'ilishi kerak (shu oyga tushgan to'lovlar), yig'ildi, qoldi; oldingi oylardan kechikkan; jami qolgan qarz
function abStats(pool) {
  const ds = data.debtors.filter((d) => !pool || d.pool === pool);
  const cnt = {}; for (const d of ds) cnt[d.currency] = (cnt[d.currency] || 0) + 1;
  const cur = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || "USD";
  const ym = today().slice(0, 7), s = { cur, need: 0, got: 0, late: 0, rem: 0, other: Object.keys(cnt).length > 1 };
  for (const d of ds) {
    if (d.currency !== cur) continue;
    s.rem += d.c.remaining;
    for (const r of d.c.rows) {
      const m = r.due.slice(0, 7);
      if (m === ym) { s.need += r.amount; s.got += r.paidAmt; }
      else if (m < ym) s.late += r.amount - r.paidAmt;
    }
  }
  for (const k of ["need", "got", "late", "rem"]) s[k] = Math.round(s[k] * 100) / 100;
  return s;
}

function abInner() {
  const [pool, title] = AB[abView], next = AB[(abView + 1) % AB.length][1], s = abStats(pool);
  const left = Math.max(0, Math.round((s.need - s.got) * 100) / 100), pct = s.need ? Math.min(100, Math.round((s.got / s.need) * 100)) : 0;
  return `
    <div class="hd"><b>${OYLAR[Number(today().slice(5, 7)) - 1]} · ${title}</b>
      <span class="nx">↻ ${next} <span class="dots">${AB.map((_, i) => `<i class="${i === abView ? "on" : ""}"></i>`).join("")}</span></span></div>
    <div class="lbl">Bu oy yig'ilishi kerak</div>
    <div class="big">${fmt(s.need, s.cur)}</div>
    <div class="two"><div class="box"><span>Yig'ildi</span><b style="color:#6ee7b7">${fmt(s.got, s.cur)}</b></div>
      <div class="box"><span>Qoldi</span><b style="color:#ffab96">${fmt(left, s.cur)}</b></div></div>
    <div class="pl"><span>Bu oy yig'ildi</span><b>${pct}%</b></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="late">Oldingi oylardan kechikkan: ${fmt(s.late, s.cur)}</div>
    <div class="ft"><span>${ic("wallet")} Jami qolgan qarz<small>${title}${s.other ? " · faqat " + s.cur : ""}</small></span><b>${fmt(s.rem, s.cur)}</b></div>`;
}

// Bosilganda karta 90° aylanadi, ichi almashadi, orqa tomondan qaytadi
function flipAb() {
  const el = $("ab"); if (!el || el.dataset.busy) return;
  el.dataset.busy = "1"; haptic("success");
  el.style.transform = "rotateY(90deg)";
  setTimeout(() => {
    abView = (abView + 1) % AB.length; el.innerHTML = abInner();
    el.style.transition = "none"; el.style.transform = "rotateY(-90deg)"; void el.offsetWidth;
    el.style.transition = "transform .22s ease-out"; el.style.transform = "rotateY(0deg)";
    setTimeout(() => { el.style.transition = ""; delete el.dataset.busy; }, 230);
  }, 220);
}

// Sanaga 1 oy qo'shadi (31-yanvar -> 28/29-fevral)
function plusMonth(s) {
  const [y0, m0, d0] = s.split("-").map(Number), idx = m0;
  const y = y0 + Math.floor(idx / 12), m = (idx % 12) + 1, last = new Date(y, m, 0).getDate();
  return `${y}-${String(m).padStart(2, "0")}-${String(Math.min(d0, last)).padStart(2, "0")}`;
}

// Asl (qo'lda o'zgartirilmagan) sana
function computedDue(d, n) {
  const [y0, m0] = d.firstDue.split("-").map(Number), idx = m0 - 1 + (n - 1);
  const y = y0 + Math.floor(idx / 12), m = (idx % 12) + 1, last = new Date(y, m, 0).getDate();
  return `${y}-${String(m).padStart(2, "0")}-${String(Math.min(Number(d.firstDue.slice(8)), last)).padStart(2, "0")}`;
}

// Tayyor matnlar ro'yxati: "📋 Tayyor matnlar" bosilganda ochiladi, birini bossangiz matn maydoniga tushadi.
// d berilsa (bitta mijozga xabar) — o'zgaruvchilar darhol mijoz ma'lumoti bilan to'ldiriladi
function presetsHtml(d) {
  return `<button class="chip" data-act="togglepresets" style="margin-top:10px">📋 Tayyor matnlar ▾</button>
    <div class="presets" id="presets">${(data.presets || []).map((p, i) => `<button class="preset" data-preset="${i}">
      <b>${esc(p.title)}</b>${esc(d ? fillVars(p.text, d) : p.text)}</button>`).join("")}</div>`;
}

// {ism} {sana} {summa} {sotilgan} {mahsulot} -> mijoz ma'lumoti (serverdagi bilan bir xil)
function fillVars(text, d) {
  const c = d.c;
  return String(text).replaceAll("{ism}", d.name).replaceAll("{sana}", fdate(c.nextDue) || "-")
    .replaceAll("{summa}", fmt(c.dueNow ?? 0, d.currency)).replaceAll("{sotilgan}", fdate(d.saleDate))
    .replaceAll("{mahsulot}", d.product || "mahsulot");
}

function showTpl() {
  sheet(`
    <div class="head"><h2>Standart eslatma matni</h2><button class="x" data-act="close">✕</button></div>
    <div class="muted">Avtomatik eslatmalarda (to'lov kuni va kechikkanlarga) shu matn ishlatiladi. Tayyor matnlardan birini tanlang yoki o'zingiz yozing. Quyidagi so'zlarni bossangiz, matnga qo'shiladi — yuborishda mijoz ma'lumoti bilan almashadi:</div>
    <div class="vars">${[["{ism}", "ism"], ["{sana}", "to'lov sanasi"], ["{summa}", "summa"], ["{sotilgan}", "sotilgan sana"], ["{mahsulot}", "mahsulot"]]
      .map(([v, t]) => `<button data-var="${v}">${v} · ${t}</button>`).join("")}</div>
    ${presetsHtml()}
    <textarea id="tplText">${esc(data.template)}</textarea>
    <button class="btn" data-act="savetpl">Saqlash</button>
    <button class="btn sec" data-act="restpl">Asl matnga qaytarish</button>`);
}

// To'lov kartalari: egasi va xodimlar qo'shadi, mijoz "💳 To'lov qilish"ni bosganda ko'radi
const fcard = (n) => String(n).replace(/(\d{4})(?=\d)/g, "$1 ");
function showCards() {
  const cards = data.cards || [];
  sheet(`
    <div class="head"><h2>💳 To'lov kartalari</h2><button class="x" data-act="close">✕</button></div>
    <div class="muted">Mijoz xabaridagi <b>💳 To'lov qilish</b> tugmasini bossa, shu kartalar va to'lashi kerak bo'lgan summa ko'rinadi. Mijoz "To'lov qildim" desa, sizga tasdiqlash tugmasi bilan xabar keladi.</div>
    <div style="margin-top:12px">${cards.map((k) => `<div class="pcard"><div><div class="muted">${esc(k.bank || "Karta")}</div>
      <div class="num">${fcard(k.number)}</div>${k.holder ? `<div class="muted">${esc(k.holder)}</div>` : ""}</div>
      <button class="del" data-delcard="${esc(k.id)}" title="O'chirish">🗑</button></div>`).join("") || '<div class="muted">Hali karta qo\'shilmagan.</div>'}</div>
    <h4>Yangi karta</h4>
    <label>Karta raqami</label><input id="cNum" inputmode="numeric" autocomplete="off" maxlength="23" placeholder="8600 1234 5678 9012">
    <div class="two"><div><label>Karta egasi</label><input id="cHolder" maxlength="60" placeholder="Ism Familiya"></div>
      <div><label>Bank / turi</label><input id="cBank" maxlength="40" placeholder="Uzcard, Humo, Visa…"></div></div>
    <button class="btn" data-act="addcard">Kartani qo'shish</button>`);
}

  sheet(`

// Tugma bosilganda: javob kelguncha tugma o'chadi (ikki marta bosilib, to'lov ikki marta yozilmasin)
let busy = false;
async function run(fn, btn) {
  if (busy) return;
  busy = true;
  const old = btn?.innerHTML;
  if (btn) { btn.classList.add("busy"); if (btn.classList.contains("btn")) btn.innerHTML = "⏳ " + old; }
  try { await fn(); haptic("success"); }
  catch (e) { haptic("error"); alertMsg(e.message || "Xatolik. Internetni tekshirib, qayta urinib ko'ring."); }
  finally { busy = false; if (btn && btn.isConnected) { btn.classList.remove("busy"); btn.innerHTML = old; } }
}

document.addEventListener("click", async (e) => {
  if (e.target.closest("#ab")) return flipAb();
  const t = e.target.closest("button, .card, [data-row], [data-pay]");
  if (!t) { if (e.target === $("ov")) closeSheet(); return; }
  if (t.id === "fab") { firstTouched = false; return showAdd(); }
  if (t.dataset.row) return showRowEdit(Number(t.dataset.row));
  if (t.dataset.pay) return showPayEdit(t.dataset.pay);
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    if (q) { q = ""; $("q").value = ""; $("q").parentElement.classList.remove("has"); }
    return renderList();
  }
  if (t.classList.contains("card")) return showDetail(t.dataset.id);
  if (t.dataset.fill) return ($("payAmt").value = t.dataset.fill);
  if (t.dataset.preset) {
    const p = data.presets[Number(t.dataset.preset)], box = $("msgText") || $("tplText");
    const d = $("msgText") ? data.debtors.find((x) => x.id === openId) : null;
    box.value = d ? fillVars(p.text, d) : p.text;
    $("presets").classList.remove("show");
    return box.focus();
  }
  if (t.dataset.var) {
    const box = $("tplText"), at = box.selectionStart ?? box.value.length;
    box.value = box.value.slice(0, at) + t.dataset.var + box.value.slice(box.selectionEnd ?? at);
    return box.focus();
  }
  if (t.dataset.copy) {
    const v = t.dataset.copy;
    try { await navigator.clipboard.writeText(v); t.textContent = "✅ Nusxa olindi"; }
    catch { prompt("Karta raqami:", v); }
    return;
  }
  if (t.dataset.delcard) return run(async () => {
    if (!(await confirmMsg("Bu karta o'chirilsinmi?"))) return;
    await api("/settings?delCard=" + t.dataset.delcard, "POST"); await load(); showCards();
  }, t);
  if (t.dataset.excuse) return run(async () => {
    const id = t.dataset.excuse, text = $("exc-" + id).value;
    await api("/excuse", "POST", { id, text }); await load(); alertMsg("Xabaringiz egasiga yuborildi ✅");
  }, t);
  if (t.dataset.undo) return run(async () => {
    if (!(await confirmMsg("Bu to'lov bekor qilinsinmi?"))) return;
    await api(`/pay?id=${openId}&pid=${t.dataset.undo}`, "DELETE"); await load();
  }, t);
  switch (t.dataset.act) {
    case "close": return closeSheet();
    case "addfirst": firstTouched = false; return showAdd();
    case "clearq": q = ""; $("q").value = ""; t.parentElement.classList.remove("has"); renderList(); return $("q").focus();
    case "back": return showDetail(openId);
    case "excel": return run(async () => { const r = await api("/export", "POST"); alertMsg(r.to === "group" ? "Excel fayl guruhga yuborildi 📥" : "Excel fayl Telegram chatingizga yuborildi 📥"); }, t);
    case "saverow": return run(async () => {
      await api("/schedule", "POST", { id: openId, n: t.dataset.n, date: $("rowDate").value }); await load();
    }, t);
    case "clearrow": return run(async () => {
      await api("/schedule", "POST", { id: openId, n: t.dataset.n, date: "" }); await load();
    }, t);
    case "savepay": return run(async () => {
      await api("/pay", "PUT", { id: openId, pid: t.dataset.pid, amount: $("epAmt").value, date: $("epDate").value, note: $("epNote").value }); await load();
    }, t);
    case "tpl": return showTpl();
    case "cards": return showCards();
    case "togglepresets": return $("presets").classList.toggle("show");
    case "addcard": return run(async () => {
      await api("/settings", "POST", { card: { number: $("cNum").value, holder: $("cHolder").value, bank: $("cBank").value } });
      await load(); showCards();
    }, t);
    case "savetpl": return run(async () => { await api("/settings", "POST", { template: $("tplText").value }); closeSheet(); await load(); }, t);
    case "restpl": return run(async () => { await api("/settings", "POST", { template: "" }); closeSheet(); await load(); }, t);
    case "pay": return run(async () => {
      const r = await api("/pay", "POST", { id: openId, amount: $("payAmt").value, date: $("payDate").value }); await load();
      showPaySummary(r.summary);
    }, t);
    case "msg": return showMsg();
    case "edit": return showEdit();
    case "saveedit": return run(async () => {
      await api("/debtors", "PUT", { id: openId, name: $("eName").value, product: $("eProduct").value,
        phone: $("ePhone").value, code: $("eCode").value, note: $("eNote").value });
      await load();
    }, t);
    case "send": return run(async () => {
      await api("/remind", "POST", { id: openId, text: $("msgText").value });
      await load(); alertMsg("Xabar yuborildi ✅ (nusxasi sizning chatingizga ham keldi)");
    }, t);
    case "invite": {
      const d = data.debtors.find((x) => x.id === openId);
      const link = `https://t.me/${data.bot}?start=d_${d.inv}`;
      return tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Assalomu alaykum! To'lovlaringizni ko'rish uchun shu havolani bosing:")}`);
    }
    case "relink": return run(async () => {
      if (!(await confirmMsg("Eski havola ishlamay qoladi va mijoz qayta ulanishi kerak. Davom etamizmi?"))) return;
      await api("/settings?relink=" + openId, "POST"); await load();
    }, t);
    case "del": return run(async () => {
      if (!(await confirmMsg("Mijoz va uning barcha to'lovlari o'chiriladi. Ishonchingiz komilmi?"))) return;
      await api(`/debtors?id=${openId}`, "DELETE"); closeSheet(); await load();
    }, t);
    case "add": return run(async () => {
      await api("/debtors", "POST", { name: $("aName").value, phone: $("aPhone").value, code: $("aCode").value,
        product: $("aProduct").value, qty: 1, buyPrice: $("aBuy").value, total: $("aTotal").value,
        down: $("aDown").value, months: $("aMonths").value, saleDate: $("aSale").value, firstDue: $("aFirst").value || undefined,
        currency: $("aCur").value, pool: $("aPool").value, note: $("aNote").value });
      closeSheet(); await load();
    }, t);
  }
});

// Harfli summani tushunadi: "12 mln", "1,5 mlrd", "500 ming", "300k", "12 000 000"
function pm(raw) {
  const m = String(raw ?? "").toLowerCase().replace(/[‘’ʻʼ`´]/g, "'").replace(/[$€₺]/g, "").trim().replace(/\s*(so'm|som|sum|usd|dollar|dolar|euro|eur|tl|lira)\.?$/, "").match(/^([\d\s.,]+?)\s*(mlrd|mlyard|milliard|milyar|mld|mln|million|milyon|m|ming|bin|k)?\.?$/);
  if (!m) return NaN;
  let s = m[1].replace(/\s/g, "").replace(/[.,]+$/, "");
  const d = s.lastIndexOf("."), c = s.lastIndexOf(",");
  if (d >= 0 && c >= 0) { const k = Math.max(d, c); s = s.slice(0, k).replace(/[.,]/g, "") + "." + s.slice(k + 1); }
  else if (d >= 0 || c >= 0) { const p = s.split(d >= 0 ? "." : ","); s = p.length > 2 || p[1].length === 3 ? p.join("") : p.join("."); }
  const mult = /^(mlrd|mlyard|milliard|milyar|mld)$/.test(m[2] ?? "") ? 1e9 : /^(mln|million|milyon|m)$/.test(m[2] ?? "") ? 1e6 : m[2] ? 1e3 : 1;
  return Math.round(Number(s) * mult * 100) / 100;
}

let firstTouched = false, totalTouched = false;
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "q") { q = e.target.value; e.target.parentElement.classList.toggle("has", !!q); return renderList(); }
  if (id === "aFirst") firstTouched = true;
  if (id === "aSale" && !firstTouched && e.target.value) $("aFirst").value = plusMonth(e.target.value);
  if (id === "cNum") e.target.value = fcard(e.target.value.replace(/\D/g, "").slice(0, 19));
  const i = $("aInfo"); if (!i) return;
  if (id === "aTotal") totalTouched = $("aTotal").value.trim() !== "";
  if (id === "aPct") totalTouched = false;
  const cur = $("aCur").value, buyRaw = $("aBuy").value.trim(), downRaw = $("aDown").value.trim();
  const buy = buyRaw ? pm(buyRaw) : null, pct = parseFloat($("aPct").value.replace(",", "."));
  const down = downRaw ? pm(downRaw) : 0, base = buy > 0 && down >= 0 && down < buy ? buy - down : null;
  // Foiz oldindan to'lovdan keyin qolgan summaga qo'shiladi: sotuv = oldindan + (xarid − oldindan) × (1 + foiz).
  // Sotuv narxi qo'lda yozilgan bo'lsa tegilmaydi.
  if (!totalTouched && base && pct >= 0) $("aTotal").value = Math.round((down + base * (1 + pct / 100)) * 100) / 100;
  const tot = pm($("aTotal").value), m = Number($("aMonths").value);
  const L = [];
  if (tot > 0) L.push(`🧾 Sotuv: <b>${fmt(tot, cur)}</b>` + (base && tot > down ? ` (qolgan ${fmt(base, cur)} ga ${Math.round(((tot - down) / base - 1) * 1000) / 10}% ustama)` : ""));
  if (tot > 0 && m > 0 && down >= 0 && down < tot) L.push(`📆 Oylik: <b>${fmt((tot - down) / m, cur)}</b> × ${m} oy` + (down > 0 ? ` · oldindan ${fmt(down, cur)}` : ""));
  if (tot > 0 && buy > 0) L.push(`💰 Foyda: <b>${fmt(tot - buy, cur)}</b>`);
  i.innerHTML = L.join("<br>");
});

load();
</script>
